<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Data dump</title>
<style>
  html,body{margin:0;background:#0a0a0a;color:#e8ff00;font-family:monospace;}
  body{padding:16px;max-width:560px;margin:0 auto;}
  h1{font-size:13px;letter-spacing:.3em;text-align:center;font-weight:normal;color:rgba(232,255,0,.6);}
  .box{border:1px solid rgba(232,255,0,.2);padding:10px;margin:10px 0;font-size:12px;line-height:1.6;white-space:pre-wrap;word-break:break-all;}
  button{width:100%;height:46px;margin:6px 0;background:none;border:1px solid rgba(232,255,0,.5);color:#e8ff00;font-family:inherit;font-size:13px;letter-spacing:.2em;}
  button:active{background:#1a1a00;}
  textarea{width:100%;height:160px;box-sizing:border-box;background:#111;color:#e8ff00;border:1px solid rgba(232,255,0,.2);font-size:10px;font-family:monospace;}
  #msg{min-height:20px;text-align:center;font-size:12px;color:#9f9;}
  .dim{color:rgba(232,255,0,.5);font-size:11px;text-align:center;}
</style>
</head>
<body>
<h1>DATA DUMP</h1>
<div class="dim">Read-only. Nothing is modified or deleted.</div>
<div id="sum" class="box">…</div>
<div id="msg"></div>
<button id="b-copy">COPY ALL DATA</button>
<button id="b-share">SHARE</button>
<button id="b-dl">DOWNLOAD FILE</button>
<textarea id="ta" readonly></textarea>
<div class="dim">If the buttons do nothing: long-press the box above, Select all, Copy.</div>
<script>
(function(){
  var o={},keys=[],i,k;
  try{
    for(i=0;i<localStorage.length;i++){k=localStorage.key(i);keys.push(k);o[k]=localStorage.getItem(k);}
  }catch(e){}
  var json=JSON.stringify(o);
  var lines=['origin: '+location.origin,'keys: '+keys.length+' · total '+json.length+' chars',''];
  keys.sort().forEach(function(k){lines.push(k+'  ('+(o[k]||'').length+')');});
  try{
    var s=JSON.parse(o.breath_sessions||'[]');
    if(s.length){
      var ts=s.map(function(x){return x.ts;}).filter(Number.isFinite).sort(function(a,b){return a-b;});
      var by={};s.forEach(function(x){var m=x.mode||'?';by[m]=by[m]||{n:0,ms:0};by[m].n++;by[m].ms+=(x.ms||0);});
      var d=function(t){return new Date(t).toISOString().slice(0,10);};
      lines.push('','sessions: '+s.length+' · '+d(ts[0])+' → '+d(ts[ts.length-1]));
      Object.keys(by).sort().forEach(function(m){lines.push('  '+m+': '+by[m].n+'x · '+Math.round(by[m].ms/60000)+' min');});
    }else lines.push('','breath_sessions: EMPTY');
  }catch(e){lines.push('','breath_sessions: unreadable');}
  document.getElementById('sum').textContent=lines.join('\n');
  var ta=document.getElementById('ta');ta.value=json;
  var msg=document.getElementById('msg');
  function say(t){msg.textContent=t;}
  document.getElementById('b-copy').onclick=function(){
    var done=false;
    try{ta.focus();ta.select();ta.setSelectionRange(0,json.length+1);done=document.execCommand('copy');}catch(e){}
    if(!done&&navigator.clipboard){navigator.clipboard.writeText(json).then(function(){say('COPIED');},function(){say('COPY FAILED - select text manually');});return;}
    say(done?'COPIED':'COPY FAILED - select text manually');
  };
  document.getElementById('b-share').onclick=function(){
    if(navigator.share){
      var p;try{p=navigator.share({title:'old_breath_localstorage',text:json});}catch(e){say('SHARE NOT AVAILABLE');return;}
      p.then(function(){say('SHARED');},function(){say('SHARE CANCELLED');});
    }else say('SHARE NOT AVAILABLE');
  };
  document.getElementById('b-dl').onclick=function(){
    try{
      var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([json],{type:'application/json'}));
      a.download='old_breath_localstorage.json';document.body.appendChild(a);a.click();document.body.removeChild(a);say('DOWNLOAD STARTED (may be ignored by this app)');
    }catch(e){say('DOWNLOAD FAILED');}
  };
})();
</script>
</body>
</html>
